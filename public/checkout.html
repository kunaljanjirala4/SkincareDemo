<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - SkincareLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-white text-gray-800 font-sans">

  <header class="bg-white shadow-md fixed w-full top-0 z-50">
      <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-pink-600">Skincare<span class="text-gray-800">Lab</span></h1>
        <nav class="space-x-6 hidden md:block">
            <a href="index.html" class="text-gray-600 hover:text-pink-500">Home</a>
            <a href="shop.html" class="text-gray-600 hover:text-pink-500">Shop</a>
            <a href="cart.html" class="text-gray-600 hover:text-pink-500">Cart</a>
        </nav>
      </div>
  </header>

  <main>
    <section class="py-32 px-6">
      <div class="max-w-7xl mx-auto">
        <h3 class="text-3xl font-bold text-pink-600 mb-10 text-center">Shipping & Payment</h3>
        <div id="checkout-area" class="flex flex-col lg:flex-row gap-12">
    
          <div class="w-full lg:w-2/3">
            <form id="shipping-form" class="space-y-8">
                <div>
                    <h4 class="text-xl font-semibold text-pink-600 mb-4">Shipping Address</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input name="fullName" type="text" placeholder="Full Name" class="w-full p-3 border rounded-lg" required>
                        <input name="email" type="email" placeholder="Email Address" class="w-full p-3 border rounded-lg" required>
                        <textarea name="address" placeholder="Street Address" class="w-full p-3 border rounded-lg md:col-span-2" required></textarea>
                        <input name="city" type="text" placeholder="City" class="w-full p-3 border rounded-lg" required>
                        <select name="state" class="w-full p-3 border rounded-lg" required>
                            <option value="">Select State</option>
                            <option value="MI">Michigan</option>
                            <option value="CA">California</option>
                            <option value="NY">New York</option>
                            </select>
                        <input name="zip" type="text" placeholder="Zip Code" class="w-full p-3 border rounded-lg" required>
                    </div>
                </div>

                <div id="payment-section" class="pt-8 border-t">
                     <h4 class="text-xl font-semibold text-pink-600 mb-4">Payment Information</h4>
                     <div class="space-y-4">
                        <input type="text" placeholder="Name on Card" class="w-full p-3 border rounded-lg" required />
                        <input type="text" placeholder="Card Number" class="w-full p-3 border rounded-lg" required />
                        <div class="flex gap-4">
                            <input type="text" placeholder="MM / YY" class="w-1/2 p-3 border rounded-lg" required />
                            <input type="text" placeholder="CVC" class="w-1/2 p-3 border rounded-lg" required />
                        </div>
                     </div>
                </div>
            </form>
          </div>
    
          <div class="w-full lg:w-1/3">
            <div class="bg-pink-50 p-8 rounded-lg shadow-md sticky top-32">
              <h4 class="text-xl font-semibold text-pink-600 mb-6">Order Summary</h4>
              <div id="summary-items" class="space-y-2 text-sm max-h-48 overflow-y-auto pr-2">
                </div>
              <hr class="my-4 border-pink-200" />
              <div class="space-y-2">
                  <div class="flex justify-between"><span>Subtotal</span><span id="summary-subtotal">$0.00</span></div>
                  <div class="flex justify-between"><span>Tax</span><span id="summary-tax">$0.00</span></div>
                  <div class="flex justify-between font-bold text-lg"><span>Total</span><span id="summary-total">$0.00</span></div>
              </div>
              <button id="checkout-btn" type="submit" form="shipping-form" class="mt-8 bg-pink-600 text-white py-3 px-6 rounded-lg hover:bg-pink-700 transition w-full font-semibold text-lg">Place Order</button>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <script src="../js/main.js"></script>
</body>
</html>
